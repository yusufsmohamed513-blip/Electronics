<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">
  <div class="row g-4">

    <!-- LEFT SIDE (PRODUCTS) -->
    <div class="col-lg-8">

      <!-- Product 1 -->
      <div class="card mb-3 p-3">
        <div class="row g-3 align-items-center">
          
          <div class="col-4 col-md-3">
            <img src="https://via.placeholder.com/150" class="img-fluid rounded">
          </div>

          <div class="col-8 col-md-9">
            <h5 class="fw-bold">Xiaomi Redmi 5 Active Speaker</h5>
            <p class="mb-1 text-muted">Xiaomi</p>

            <!-- Quantity -->
            <div class="d-flex align-items-center gap-3 my-2">
              <span>-</span>
              <span class="badge bg-info fs-6">1</span>
              <span>+</span>
            </div>

            <h5>₹ 1200</h5>
          </div>

        </div>
      </div>

      <!-- Product 2 -->
      <div class="card p-3">
        <div class="row g-3 align-items-center">
          
          <div class="col-4 col-md-3">
            <img src="https://via.placeholder.com/150" class="img-fluid rounded">
          </div>

          <div class="col-8 col-md-9">
            <h5 class="fw-bold">Ajaaz Wireless Keyboard</h5>
            <p class="mb-1 text-muted">Ajaaz</p>

            <!-- Quantity -->
            <div class="d-flex align-items-center gap-3 my-2">
              <span>-</span>
              <span class="badge bg-info fs-6">1</span>
              <span>+</span>
            </div>

            <h5>₹ 1650</h5>
          </div>

        </div>
      </div>

    </div>

    <!-- RIGHT SIDE (ORDER SUMMARY) -->
    <div class="col-lg-4">
      <div class="card p-4 bg-secondary bg-opacity-25">

        <h4 class="fw-bold mb-4">Order Summary</h4>

        <div class="d-flex justify-content-between">
          <span>Subtotal</span>
          <span>₹ 14,580</span>
        </div>

        <div class="d-flex justify-content-between">
          <span>Delivery Charges</span>
          <span>₹ 0</span>
        </div>

        <div class="d-flex justify-content-between">
          <span>Discount</span>
          <span>- ₹ 220</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between fw-bold">
          <span>TOTAL</span>
          <span>₹ 14,360</span>
        </div>

        <div class="text-center mt-4">
          <button class="btn btn-info px-5">CHECKOUT</button>
        </div>

        <p class="text-center mt-3 mb-0">
          🔒 100% Secure Payments
        </p>

      </div>
    </div>

  </div>
</div>

</body>
</html>
